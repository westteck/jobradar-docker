# ─────────────────────────────────────────────────────────────
# Discovery — keyword-based scraping via Remotive + Arbeitnow
# Queries target practice admin, privacy specialist, medical admin
# ─────────────────────────────────────────────────────────────
discovery:
  enabled: true
  queries: ["practice administrator", "medical office manager", "healthcare administrator", "privacy specialist", "medical staff coordinator", "practice manager"]
  max_per_query: 40
  expire_after_days: 4

filters:
  title_include: ["administrator", "manager", "coordinator", "specialist", "analyst", "director", "officer", "assistant", "supervisor", "privacy", "compliance", "operations", "medical", "practice", "healthcare", "clinic", "office"]
  title_exclude: ["intern", "resident", "fellow", "10+ years", "chief medical", "physician", "nurse practitioner", "MD ", "DO "]
  locations: []

llm:
  provider: none
  model: ""
  min_score: 6
  triage: false
  triage_floor: 3
  batch_size: 25
  tokens_per_batch: 3400
  daily_token_limit: 500000
  max_to_score: 5000

digest:
  max_jobs: 60

alerts:
  companies: [Adventist Health, Providence Health, Molina Healthcare, Envision Healthcare, Tenet Healthcare, Loma Linda University Health, US Acute Care Solutions, Fresenius Medical Care, Marathon Health, Centene, Elevance Health (Anthem Blue Cross), Stryker, Sharp HealthCare, Palomar Health]
  min_score: 6
  max_per_alert: 15